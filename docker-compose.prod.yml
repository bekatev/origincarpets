version: '3.3'

services:
  carp:
    image: carp_carp:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://origincarpets.com/api
        NEXT_PUBLIC_PURCHASE_ENABLED: "true"
    container_name: origincarpets-app
    restart: unless-stopped
    network_mode: host
    volumes:
      # Editorial/brand images update on git pull — no Docker rebuild needed.
      - ./frontend/public:/app/frontend/public:ro
      # Nest fallback uploads dir
      - ./data/uploads:/app/backend/uploads
      # Same folder nginx already serves as /file.webp for the catalog
      - /home/gdg/.carpets-data/uploads:/legacy-uploads
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://origincarpets.com
      NEXT_PUBLIC_API_URL: https://origincarpets.com/api
      INTERNAL_API_URL: http://127.0.0.1:4000/api
