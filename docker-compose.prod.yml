version: '3.3'

services:
  carp:
    image: carp_carp:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://origincarpets.com/api
        NEXT_PUBLIC_SITE_URL: https://origincarpets.com
        NEXT_PUBLIC_PURCHASE_ENABLED: "true"
        # Umami Cloud website ID (cloud.umami.is) — empty disables analytics
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: "1595dbe3-2176-45b5-b09f-3e5be99ff4f6"
    container_name: origincarpets-app
    restart: unless-stopped
    network_mode: host
    volumes:
      # Editorial/brand images update on git pull — no Docker rebuild needed.
      - ./frontend/public:/app/frontend/public:ro
      # Admin product uploads (served at /api/media/...)
      - ./data/uploads:/app/backend/uploads
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://origincarpets.com
      NEXT_PUBLIC_API_URL: https://origincarpets.com/api
      NEXT_PUBLIC_SITE_URL: https://origincarpets.com
      INTERNAL_API_URL: http://127.0.0.1:4000/api
